<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App com Login - Vercel</title>
    <!-- Usando Tailwind CSS para deixar o visual bonito automaticamente -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center font-sans">
    
    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md text-center border border-slate-200">
        <h1 class="text-3xl font-bold text-slate-800 mb-2">Meu App Seguro 🔐</h1>
        <p class="text-slate-500 mb-8 text-sm">Hospedado na Vercel</p>
        
        <!-- Área onde o formulário de login vai aparecer -->
        <div id="auth-container" class="flex justify-center items-center min-h-[300px]">
            <p class="text-slate-400 animate-pulse font-medium">Carregando sistema de segurança...</p>
        </div>

        <!-- Área protegida (Dashboard) - Só aparece se logar -->
        <div id="dashboard" class="hidden flex-col items-center">
            <div class="bg-emerald-100 text-emerald-800 px-4 py-3 rounded-lg font-semibold mb-6 w-full border border-emerald-200">
                ✅ Login realizado com sucesso!
            </div>
            
            <p class="text-slate-600 mb-8 text-lg" id="welcome-message"></p>
            
            <p class="text-sm text-slate-400 mb-4">Gerencie sua conta clicando no ícone abaixo:</p>
            <!-- O botão de perfil (avatar) do usuário vai aparecer aqui -->
            <div id="user-button" class="transform scale-125 mb-4"></div>
        </div>
    </div>

    <!-- Lógica de controle do Login e Inicialização do Clerk -->
    <script>
        // 1. ATENÇÃO: Cole sua Publishable Key do Clerk abaixo (Substitua a palavra COLE_SUA_CHAVE_AQUI)
        const PUBLISHABLE_KEY = "pk_test_bGVhcm5pbmctY29yYWwtMzMuY2xlcmsuYWNjb3VudHMuZGV2JA";

        const initApp = async () => {
            try {
                // Inicia o Clerk
                await window.Clerk.load();
                
                const authContainer = document.getElementById('auth-container');
                const dashboard = document.getElementById('dashboard');
                const welcomeMessage = document.getElementById('welcome-message');
                const userButton = document.getElementById('user-button');

                // Verifica se existe um usuário conectado
                if (window.Clerk.user) {
                    // MODO LOGADO: Esconde o login e mostra o Dashboard
                    authContainer.classList.add('hidden');
                    dashboard.classList.remove('hidden');
                    dashboard.classList.add('flex');
                    
                    // Pega o nome ou e-mail da pessoa logada
                    const user = window.Clerk.user;
                    const name = user.firstName || user.primaryEmailAddress.emailAddress;
                    welcomeMessage.innerHTML = `Bem-vindo(a) ao seu painel interno, <strong>${name}</strong>!`;
                    
                    // Monta a bolinha com a foto de perfil do usuário (permite deslogar)
                    window.Clerk.mountUserButton(userButton);
                } else {
                    // MODO DESLOGADO: Mostra o formulário de login
                    authContainer.innerHTML = ''; 
                    window.Clerk.mountSignIn(authContainer);
                }
            } catch (err) {
                const detalheErro = err && err.message ? err.message : "Script do Clerk bloqueado ou não carregado.";
                document.getElementById('auth-container').innerHTML = 
                    `<div class="text-red-600 bg-red-50 p-5 rounded-lg border border-red-200 text-left text-sm">
                        <p class="font-bold text-base mb-2">Erro ao iniciar a segurança 🛑</p>
                        <p class="mb-2"><strong>Motivo:</strong> ${detalheErro}</p>
                        <p class="text-slate-600 mt-3 pt-3 border-t border-red-200">
                            <strong>Dica:</strong> Se o link no seu navegador começa com <code>file:///</code>, o login não vai funcionar. 
                            Acesse através do link oficial gerado pela Vercel!
                        </p>
                    </div>`;
                console.error("Erro completo:", err);
            }
        };

        // 2. Carrega o script do Clerk dinamicamente para garantir que a UI funcione
        const script = document.createElement('script');
        script.setAttribute('data-clerk-publishable-key', PUBLISHABLE_KEY);
        script.async = true;
        // Travando na versão 5 para evitar bugs da versão mais recente (@latest)
        script.src = 'https://cdn.jsdelivr.net/npm/@clerk/clerk-js@5/dist/clerk.browser.js';
        script.crossOrigin = 'anonymous';
        
        // Só chama o nosso app DEPOIS que o script do Clerk terminar de baixar
        script.addEventListener('load', initApp);
        document.body.appendChild(script);

    </script>
</body>
</html>
